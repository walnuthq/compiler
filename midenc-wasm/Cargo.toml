[package]
name = "midenc-wasm"
version = "0.4.1"
edition = "2021"
rust-version = "1.76"
description = "WebAssembly bindings for the Miden compiler"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

# Compiler dependencies
midenc-compile = { path = "../midenc-compile", default-features = false }
midenc-session = { path = "../midenc-session", default-features = false }
midenc-frontend-wasm = { path = "../frontend/wasm", default-features = false }
midenc-hir = { path = "../hir", default-features = false, features = ["serde"] }
midenc-hir-transform = { path = "../hir-transform", default-features = false }
midenc-codegen-masm = { path = "../codegen/masm", default-features = false, features = ["serde"] }
midenc-dialect-hir = { path = "../dialects/hir", default-features = false }
midenc-dialect-scf = { path = "../dialects/scf", default-features = false }

# Serialization
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
serde-wasm-bindgen = "0.6"

[dependencies.web-sys]
version = "0.3"
features = ["console"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-mutable-globals"]
