[package]
name = "midenc-integration-network-tests"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true
publish = false

[dependencies]
# miden-client v0.13 from git (not yet on crates.io)
miden-client = { git = "https://github.com/0xMiden/miden-client.git", branch = "next", features = ["std", "tonic", "testing"] }
miden-core.workspace = true
miden-standards = { workspace = true, features = ["std", "testing"] }
miden-testing = { workspace = true, features = ["std"] }
miden-felt-repr-offchain = { version = "0.7.1", path = "../../sdk/felt-repr/offchain" }
miden-mast-package.workspace = true
miden-protocol = { workspace = true, features = ["std", "testing"] }
midenc-frontend-wasm.workspace = true
rand = "0.9"
tokio.workspace = true

# For accessing the test builder from the main integration tests
miden-integration-tests = { path = "../integration" }
